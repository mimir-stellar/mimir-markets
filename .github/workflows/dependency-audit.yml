name: dependency-audit

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          audit_status=$?
          set -e
          node scripts/check-npm-audit.mjs npm-audit.json | tee npm-audit-report.md
          triage_status=${PIPESTATUS[0]}
          if [ "$audit_status" -ne 0 ] || [ "$triage_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.run_id }}
          path: |
            npm-audit.json
            npm-audit-report.md
          if-no-files-found: error
